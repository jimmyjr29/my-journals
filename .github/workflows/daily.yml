name: Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"  # setiap hari jam 00:00 UTC
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update file
        run: |
          echo "✅ Update: $(date -u)" >> daily.md

      - name: Commit changes
        run: |
          git config user.name "jimmyjr29"
          git config user.email "fiverjims29@gmail.com"
          git add .
          git commit -m "🔄 Daily commit: $(date -u)" || echo "Nothing to commit"

      - name: Push changes
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jimmyjr29/my-journals.git main
