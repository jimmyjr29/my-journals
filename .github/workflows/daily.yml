name: Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"  # Setiap hari jam 07:00 WIB
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create daily.md if not exists & update
        run: |
          echo "✅ Update: $(date -u)" >> daily.md

      - name: Commit changes
        run: |
          git config --global user.name "jimmyjr29"
          git config --global user.email "fiverjims29@gmail.com"
          git add .
          git commit -m "🔄 Daily commit: $(date -u)" || echo "✅ Nothing to commit"

      - name: Push changes
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jimmyjr29/my-journals.git HEAD:main
