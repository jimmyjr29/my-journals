name: Daily Journal Commit

on:
  schedule:
    - cron: "0 0 * * *"  # Setiap hari pukul 00:00 UTC
  workflow_dispatch:

jobs:
  daily-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Journal File
        run: |
          mkdir -p journal
          today=$(date -u +"%Y-%m-%d")
          file="journal/$today.md"
          echo "# 📅 Journal: $today" > $file
          echo "" >> $file
          echo "🕒 Waktu UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $file
          echo "✅ Auto-update: commit harian berhasil." >> $file
          echo "" >> $file
          echo "✍️ Catatan:" >> $file
          echo "- [ ] " >> $file

      - name: Commit & Push
        run: |
          git config user.name "jimmyjr29"
          git config user.email "fiverjims29@gmail.com"
          git add .
          git commit -m "📝 Journal entry for $(date -u +"%Y-%m-%d")" || echo "Nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jimmyjr29/my-journals.git main
